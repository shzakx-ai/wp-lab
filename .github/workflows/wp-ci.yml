name: WP Lab CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: wp-lab-${{ github.ref }}
  cancel-in-progress: true

env:
  WP_PLAYGROUND_CLI: "@wp-playground/cli@3.1.55"

jobs:
  build-test:
    name: Lint + Boot + Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: PHP lint
        run: find wp-content -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Security guard (dangerous functions)
        run: |
          if grep -rnE '\b(eval|shell_exec|passthru|proc_open|popen)[[:space:]]*\(|base64_decode[[:space:]]*\(' wp-content --include='*.php'; then
            echo "FAIL: dangerous PHP function found"
            exit 1
          fi
          echo "security guard: clean"

      - name: Cache Playground downloads
        uses: actions/cache@v4
        with:
          path: ~/.wordpress-playground
          key: wp-playground-cache-cli355-v1
          restore-keys: |
            wp-playground-cache-

      - name: Boot WordPress Playground (mounted theme + blueprint)
        run: |
          npx --yes "$WP_PLAYGROUND_CLI" server \
            --verbosity=debug \
            --mount="$GITHUB_WORKSPACE/wp-content/themes/lab-theme:/wordpress/wp-content/themes/lab-theme" \
            --blueprint="$GITHUB_WORKSPACE/blueprint.json" \
            --port=9400 &> /tmp/playground.log &
          echo "Waiting for boot to complete (Ready! in log; the port binds BEFORE boot finishes) ..."
          rc=0
          timeout 480 bash -c '
            until grep -q "Ready!" /tmp/playground.log 2>/dev/null; do
              if grep -qE "ResourceDownloadError|Error when executing the blueprint" /tmp/playground.log 2>/dev/null; then exit 2; fi
              sleep 3
            done' || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: boot did not complete (rc=$rc)"
            tail -80 /tmp/playground.log
            exit 1
          fi
          echo "Boot complete. Log tail:"
          tail -6 /tmp/playground.log

      - name: Smoke tests (HTTP, after boot completion)
        run: |
          echo "=== post-boot probes ==="
          echo "Ready lines: $(grep -c 'Ready!' /tmp/playground.log || true)"
          # The auto-login mu-plugin answers 302 + Set-Cookie to every request that
          # does not carry the playground_auto_login_already_happened cookie; curl
          # only survives that dance when it keeps a cookie jar. Without one it
          # loops until curl's redirect cap (exit 47).
          JAR=/tmp/wp-lab-cookies.txt
          touch "$JAR"
          echo "--- raw response #1 (headers only, no redirects followed) ---"
          curl -sS -D - -o /dev/null --max-time 15 http://127.0.0.1:9400/ | head -12 || true
          echo "--- raw response #2 (headers only, no redirects followed) ---"
          curl -sS -D - -o /dev/null --max-time 15 http://127.0.0.1:9400/ | head -12 || true
          code=$(curl -sSL -c "$JAR" -b "$JAR" --max-redirs 10 -o /tmp/home.html -w "%{http_code}" http://127.0.0.1:9400/)
          echo "homepage HTTP=$code"
          echo "--- homepage head ---"
          head -40 /tmp/home.html || true
          test "$code" = "200" || { echo "FAIL: homepage HTTP $code"; tail -120 /tmp/playground.log; exit 1; }
          grep -q "wp-lab-smoke-marker" /tmp/home.html || { echo "FAIL: lab-theme smoke marker missing - theme did not render"; exit 1; }
          grep -q "WP Lab Site" /tmp/home.html || { echo "FAIL: blueprint site options not applied"; exit 1; }

          grep -q "STYLESHEET=lab-theme" /tmp/playground.log \
            && echo "blueprint assertion logged: lab-theme active" \
            || echo "note: runPHP output not captured in log (non-fatal)"

          page_code=$(curl -sSL -c "$JAR" -b "$JAR" --max-redirs 10 -o /dev/null -w "%{http_code}" "http://127.0.0.1:9400/?pagename=lab-page")
          echo "lab-page HTTP=$page_code"
          test "$page_code" = "200" || { echo "FAIL: page check HTTP $page_code"; exit 1; }
          echo "smoke: OK"

      - name: Screenshot homepage (best effort)
        continue-on-error: true
        run: |
          mkdir -p artifacts
          npm install --no-save --silent playwright
          npx playwright install chromium || npx playwright install --with-deps chromium
          npx playwright screenshot --viewport-size="1280,900" --full-page --wait-for-timeout=1500 http://127.0.0.1:9400/ artifacts/home.png
          ls -la artifacts

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          (cd wp-content/themes && zip -qr "$GITHUB_WORKSPACE/artifacts/lab-theme.zip" lab-theme)
          cp /tmp/playground.log artifacts/playground.log || true
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wp-lab-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playground log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playground-log
          path: /tmp/playground.log
          if-no-files-found: ignore
